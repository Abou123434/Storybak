<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Dare</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== SCREEN 1 HOME ===== -->
<div id="home" class="screen">

    <div class="top">
        <div class="menu">☰</div>
        <div class="title">Daily Dare 🌍</div>
    </div>

    <div class="center">
        <div class="challengeBox">
            <div class="challengeLabel">📅 Défi du jour</div>
            <div id="challengeTitle" class="challengeTitle">Chargement...</div>
        </div>

        <button class="mainBtn" onclick="goParticipate()">📸 Participer</button>
        <button class="linkBtn" onclick="openFeed()">Voir les participations 👀</button>
    </div>

</div>


<!-- ===== SCREEN 2 PARTICIPATE ===== -->
<div id="participate" class="screen">

    <div class="top">
        <button class="backBtn" onclick="goHome()">←</button>
        <div class="title">Participer</div>
    </div>

    <div class="center">
        <input type="file" id="photoInput" accept="image/*" capture="environment">
        <button id="publishBtn" class="mainBtn">Publier 🚀</button>
    </div>

</div>


<!-- ===== SCREEN 3 FEED ===== -->
<div id="feed" class="screen">

    <div class="top">
        <button class="backBtn" onclick="goHome()">←</button>
        <div class="title">Feed 🌍</div>
    </div>

    <div id="feedGrid" class="feedGrid"></div>

</div>


<script src="app.js"></script>
</body>
</html>
