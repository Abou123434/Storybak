<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Daily Dare 🌍</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- MENU -->
<div class="menuBtn" onclick="openFeed()">☰</div>

<!-- ============ ECRAN 1 ACCUEIL ============ -->
<section id="home" class="screen active">
    <h1 class="logo">Daily Dare 🌍</h1>

    <div class="challengeBox">
        <h2>📅 Défi du jour</h2>
        <p id="dailyText"></p>
    </div>

    <button class="mainBtn" onclick="goParticipate()">📸 Participer</button>
    <button class="secondaryBtn" onclick="openFeed()">👀 Voir les participations</button>
</section>

<!-- ============ ECRAN 2 PARTICIPER ============ -->
<section id="participate" class="screen">
    <h2>📅 Défi : <span id="challengeTitle"></span></h2>

    <!-- input invisible mais actif -->
    <input type="file" id="photoInput" accept="image/*"
           style="opacity:0; width:0.1px; height:0.1px; position:absolute; z-index:1; left:0; top:0;">

    <!-- bouton cliquable avec animation CSS -->
    <label for="photoInput" class="mainBtn" style="position:relative; z-index:10; display:inline-block;">
        🚀 Publier
    </label>

    <button class="secondaryBtn" onclick="goHome()">⬅ Retour</button>
</section>

<!-- ============ ECRAN 3 FEED ============ -->
<section id="feed" class="screen">
    <h2>🌍 Photos du monde</h2>
    <div id="grid"></div>
    <button class="secondaryBtn" onclick="goHome()">⬅ Retour</button>
</section>

<script src="app.js"></script>
</body>
</html>
