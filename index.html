<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Défis Impossibles 🔥</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    text-align: center;
}

header {
    padding: 15px;
    background: red;
    font-size: 20px;
}

button {
    padding: 15px;
    margin: 10px;
    border-radius: 20px;
    border: none;
    font-size: 16px;
}

#gameArea {
    margin-top: 30px;
}

#box {
    width: 80px;
    height: 80px;
    background: yellow;
    position: absolute;
    display: none;
}
</style>
</head>

<body>

<header>🔥 Défis Impossibles 🔥</header>

<div>
    <button onclick="startClick()">⚡ Clique rapide</button>
    <button onclick="startCatch()">🎯 Attrape le carré</button>
</div>

<div id="gameArea"></div>
<div id="result"></div>

<div id="box" onclick="catchBox()"></div>

<script>
let clicks = 0;
let gameActive = false;

// ⚡ CLICK GAME
function startClick() {
    clicks = 0;
    gameActive = true;
    document.getElementById("gameArea").innerHTML =
        "<button onclick='countClick()'>CLIQUE !!!</button>";

    setTimeout(() => {
        gameActive = false;
        showResult("⚡ Score: " + clicks + " clics");
    }, 5000);
}

function countClick() {
    if(gameActive) clicks++;
}

// 🎯 CATCH GAME
function startCatch() {
    gameActive = true;
    document.getElementById("box").style.display = "block";
    moveBox();

    setTimeout(() => {
        gameActive = false;
        document.getElementById("box").style.display = "none";
        showResult("🎯 Score terminé !");
    }, 5000);
}

function moveBox() {
    if(!gameActive) return;

    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;

    let box = document.getElementById("box");
    box.style.left = x + "px";
    box.style.top = y + "px";

    setTimeout(moveBox, 800);
}

let scoreCatch = 0;
function catchBox() {
    if(gameActive) scoreCatch++;
}

// 📲 SHARE
function showResult(text) {
    document.getElementById("result").innerHTML = `
        <h2>${text}</h2>

        <a href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank">
        📲 WhatsApp
        </a>

        <br><br>
        <button onclick="copy('${text}')">📋 Copier (TikTok)</button>
    `;
}

function copy(text) {
    navigator.clipboard.writeText(text);
    alert("Copié 🔥");
}
</script>

</body>
</html>
