<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryBak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <h1 class="logo">Story<span class="highlight">Bak</span></h1>
</header>

<input type="file" id="fileInput" accept="image/*,video/*" hidden>

<!-- ===== STORIES ===== -->
<div class="stories" id="stories"></div>

<!-- ===== VIEWER ===== -->
<div class="viewer" id="viewer">
  <div id="progressContainer"></div>
  <div class="content" id="content"></div>

  <div class="view-count" id="viewCount"></div>

  <div class="reactions">
    <span onclick="react('❤️')">❤️</span>
    <span onclick="react('😂')">😂</span>
    <span onclick="react('🔥')">🔥</span>
    <span onclick="react('😮')">😮</span>
  </div>

  <div class="tap-left" onclick="prevStory()"></div>
  <div class="tap-right" onclick="nextStory()"></div>

  <div id="progressControls"></div>
</div>

<!-- ===== 🔐 KYC ===== -->
<div id="kycModal">
  <div class="modal-content">

    <h3>Vérification KYC</h3>

    <input type="text" id="kycFullName" placeholder="Nom complet">
    <input type="date" id="kycDOB">
    <input type="text" id="kycCountry" placeholder="Pays">

    <select id="kycDocumentType">
      <option>Carte d'identité</option>
      <option>Passeport</option>
      <option>Permis de conduire</option>
    </select>

    <input type="file" id="kycDocument">
    <input type="file" id="kycSelfie">

    <div id="kycMessage"></div>

    <button id="submitKYC" class="green-btn">Envoyer</button>
    <button id="closeKYC" class="red-btn">Fermer</button>

  </div>
</div>

<!-- ===== 🎁 GIFT ===== -->
<div id="giftModal">
  <div class="modal-content">
    <div id="coinBalance" class="balance">💰 0</div>

    <button id="buyCoins" class="buy-btn">+ Acheter des coins</button>

    <h3 class="gift-title">Envoyer un cadeau</h3>

    <div class="gift-options">
      <button class="gift-btn" data-cost="1">🌹 Rose</button>
      <button class="gift-btn" data-cost="10">🔥 Feu</button>
      <button class="gift-btn" data-cost="100">🚀 Fusée</button>
    </div>

    <div id="giftMessage"></div>

    <button id="closeGiftModal" class="red-btn">Fermer</button>
  </div>
</div>

<!-- ===== 🍔 MENU ===== -->
<div id="hamburgerContainer">
  <div id="hamburger">&#9776;</div>

  <div id="menuOptions">
    <p id="walletBtn">🪙 Mon solde</p>
    <p id="adminBtn">⚙️ Admin Panel</p>
  </div>
</div>

<!-- ===== ⚙️ ADMIN PANEL ===== -->
<div id="adminPanel">

  <div class="admin-header">
    <h2>Admin Panel</h2>
    <button onclick="closeAdmin()" class="red-btn">Fermer</button>
  </div>

  <div class="platform-balance">
    Solde de la plateforme
  </div>

  <div class="admin-actions">
    <button class="admin-btn" id="kycBtn">Vérification KYC</button>
    <button class="admin-btn">Bannir un utilisateur</button>
    <button class="admin-btn">Statistiques</button>
  </div>

  <div class="admin-body"></div>

</div>

<script src="script.js"></script>
</body>
    </html>
