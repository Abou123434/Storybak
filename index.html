<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories + Profil + KYC</title>
<style>
  body { background:#0f0f0f; color:white; font-family:sans-serif; margin:0; padding:0; }
  #stories { display:flex; flex-wrap:wrap; gap:15px; padding:15px; }
  .story { text-align:center; cursor:pointer; position:relative; }
  .story .plus { position:absolute; top:0; right:0; background:#25D366; width:20px; height:20px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; }
  #viewer { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); justify-content:center; align-items:center; flex-direction:column; z-index:999; }
  #content { max-width:90%; max-height:70%; margin-bottom:10px; }
  #content img, #content video { max-width:100%; max-height:100%; border-radius:15px; }
  .progress { width:100%; height:5px; background:#555; margin:2px 0; border-radius:2px; overflow:hidden; }
  .progress-inner { height:100%; width:0%; background:#25D366; transition:width 0.05s linear; }
  #progressControls { display:flex; align-items:center; gap:10px; margin-bottom:5px; flex-wrap:wrap; }
  .reactions-display { position:absolute; top:20%; left:50%; transform:translateX(-50%); font-size:50px; pointer-events:none; }
  button { cursor:pointer; border:none; border-radius:5px; padding:5px 10px; }
  .green-btn { background:#25D366; color:#000; }
  .red-btn { background:red; color:#fff; }
  input[type="file"] { display:none; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:9999; }
  .modal div { background:#111; padding:25px; border-radius:15px; text-align:center; color:white; max-width:300px; width:90%; }
  #giftModal .gift-options button { margin:5px; }
</style>
</head>
<body>

<!-- ADD STORY FILE INPUT -->
<input type="file" id="fileInput" accept="image/*,video/*">

<!-- STORIES CONTAINER -->
<div id="stories"></div>

<!-- VIEWER -->
<div id="viewer">
  <div id="content"></div>
  <div id="progressControls"></div>
  <div id="progressContainer" style="width:80%;"></div>
  <div id="viewCount" style="margin-top:5px;"></div>
</div>

<!-- GIFT MODAL -->
<div id="giftModal" class="modal">
  <div>
    <h3>Envoyer un cadeau</h3>
    <p id="coinBalance"></p>
    <div class="gift-options">
      <button data-cost="5">🎁 Petit</button>
      <button data-cost="10">🎁 Moyen</button>
      <button data-cost="20">🎁 Gros</button>
    </div>
    <p id="giftMessage"></p>
    <button id="closeGiftModal">Fermer</button>
  </div>
</div>

<!-- WALLET MODAL -->
<div id="walletOverlay" class="modal">
  <div>
    <h3>Wallet</h3>
    <p>Coins: <span id="walletCoins"></span></p>
    <p>Diamonds: <span id="walletDiamonds"></span></p>
    <p>Valeur: <span id="walletValue"></span> €</p>
    <button id="walletBuyCoins">Acheter Coins</button>
    <button id="withdrawBtn">Retirer</button>
    <button id="closeWallet">Fermer</button>
  </div>
</div>

<!-- BUY COINS MODAL -->
<div id="buyCoinsModal" class="modal">
  <div>
    <h3>Acheter Coins</h3>
    <button onclick="openPayment()">Paiement</button>
    <button onclick="closeBuy()">Fermer</button>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div id="paymentModal" class="modal">
  <div>
    <h3>Paiement</h3>
    <button onclick="openBlank()">Ouvrir paiement</button>
    <button onclick="closePayment()">Fermer</button>
  </div>
</div>

<!-- KYC MODAL -->
<div id="kycModal" class="modal">
  <div>
    <h3>KYC Vérification</h3>
    <input type="text" id="kycFullName" placeholder="Nom complet"><br><br>
    <input type="date" id="kycDOB"><br><br>
    <input type="text" id="kycCountry" placeholder="Pays"><br><br>
    <input type="file" id="kycDocument"><br><br>
    <p id="kycMessage"></p>
    <button id="submitKYC">Soumettre</button>
    <button id="closeKYC">Fermer</button>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div id="withdrawModal" class="modal">
  <div>
    <h3>Retrait</h3>
    <button id="withdrawPaypalBtn">Retrait PayPal</button>
    <button id="closeWithdraw">Fermer</button>
  </div>
</div>

<!-- CHANGE PROFILE BUTTON -->
<button id="changeProfileBtn">Modifier Profil</button>

<!-- HAMBURGER MENU -->
<button id="hamburger">☰</button>
<div id="menuOptions" style="display:none; flex-direction:column; position:absolute; top:40px; left:10px; gap:5px;">
  <button id="walletBtn">Wallet</button>
  <button id="buyCoins">Acheter Coins</button>
</div>

<!-- PROFILE MODAL sera créé dynamiquement via JS -->

<script src="app.js"></script>

</body>
    </html>
