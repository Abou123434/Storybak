<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

       SEO
  ========================== -->

  <meta

    content="Storybak est un jeu de mémoire et de réflexion en ligne gratuit. Teste ta mémoire, ta concentration et tes réflexes avec des séquences de couleurs."
  >

  <meta

    content="index, follow"
  >

  <meta

    content="Storybak"
  >

  <meta

    content="Storybak"
  >

  <link

    href="https://sparkly-selkie-3f6ac4.netlify.app/"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <!-- =========================
       OPEN GRAPH
  ========================== -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Storybak – Jeu de mémoire et de réflexion"
  >

  <meta
    property="og:description"
    content="Teste ta mémoire, ta concentration et tes réflexes avec Storybak, un jeu gratuit de réflexion et de mémoire en ligne."
  >

  <meta
    property="og:url"
    content="https://sparkly-selkie-3f6ac4.netlify.app/"
  >

  <meta
    property="og:site_name"
    content="Storybak"
  >

  <meta
    property="og:locale"
    content="fr_FR"
  >

  <!-- =========================
       TWITTER / X
  ========================== -->

  <meta
    name="twitter:card"
    content="summary"
  >

  <meta
    name="twitter:title"
    content="Storybak – Jeu de mémoire et de réflexion"
  >

  <meta
    name="twitter:description"
    content="Jeu gratuit de mémoire, de réflexion et de concentration en ligne."
  >

  

  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <!-- =====================================================
       🎮 CONTENEUR PRINCIPAL
  ====================================================== -->

  <div
    class="container"
    id="game"
  >


    <!-- =====================================================
         🧠 TITRE
    ====================================================== -->

    <h1 id="title">
      🧠 Memory Flash Pro
    </h1>


    <!-- =====================================================
         🌍 LANGUE
    ====================================================== -->

    <label id="langLabel">
      🌍 Langue :
    </label>

    <select id="langSelect">

      <option value="fr">
        Français
      </option>

      <option value="en">
        English
      </option>

      <option value="es">
        Español
      </option>

      <option value="de">
        Deutsch
      </option>

      <option value="ar">
        العربية
      </option>

    </select>


    <!-- =====================================================
         📊 INFORMATIONS DU JEU
    ====================================================== -->

    <p>

      <span id="levelLabel">
        Niveau
      </span>

      :

      <span id="level">
        1
      </span>

    </p>


    <p>

      <span id="scoreLabel">
        Score
      </span>

      :

      <span id="score">
        0
      </span>

    </p>


    <p>

      <span id="livesLabel">
        Vies
      </span>

      :

      <span id="lives">
        5
      </span>

    </p>


    <!-- =====================================================
         🔄 BOUTON « REJOUER » (solo : plus de vies, gratuit)
    ====================================================== -->

    <button
      id="refillBtn"
      type="button"
      style="display:none;"
    >
      🔄 Rejouer
    </button>


    <!-- =====================================================
         💬 MESSAGE
    ====================================================== -->

    <p id="msg">
      Appuie sur START
    </p>


    <!-- =====================================================
         ⏱️ TIMER
    ====================================================== -->

    <p id="timer"></p>


    <!-- =====================================================
         🎨 4 CARRÉS DE SÉQUENCE
    ====================================================== -->

    <div
      id="flashGrid"
      class="grid"
    >

      <div
        class="btn red"
        onclick="pick('red')"
      ></div>

      <div
        class="btn green"
        onclick="pick('green')"
      ></div>

      <div
        class="btn blue"
        onclick="pick('blue')"
      ></div>

      <div
        class="btn yellow"
        onclick="pick('yellow')"
      ></div>

    </div>


    <!-- =====================================================
         🎮 BOUTONS JOUEUR
    ====================================================== -->

    <div
      id="answerBox"
      class="hidden"
    >

      <button
        type="button"
        class="answer-btn red"
        onclick="pick('red')"
      >
        <span
          class="color-name"
          data-color="red"
        >
          Rouge
        </span>
      </button>


      <button
        type="button"
        class="answer-btn green"
        onclick="pick('green')"
      >
        <span
          class="color-name"
          data-color="green"
        >
          Vert
        </span>
      </button>


      <button
        type="button"
        class="answer-btn blue"
        onclick="pick('blue')"
      >
        <span
          class="color-name"
          data-color="blue"
        >
          Bleu
        </span>
      </button>


      <button
        type="button"
        class="answer-btn yellow"
        onclick="pick('yellow')"
      >
        <span
          class="color-name"
          data-color="yellow"
        >
          Jaune
        </span>
      </button>

    </div>


    <!-- =====================================================
         ⭐ START
    ====================================================== -->

    <button
      id="star"
      type="button"
    >

      <span id="startText">
        ⭐ Commencer
      </span>

    </button>


  </div>


  <!-- =====================================================
       🔊 SONS
  ====================================================== -->

  <audio
    id="clickSound"
    src="click.mp3"
  ></audio>

  <audio
    id="winSound"
    src="win.mp3"
  ></audio>

  <audio
    id="failSound"
    src="fail.mp3"
  ></audio>


  <!-- =====================================================
       📢 PUBLICITÉS Y8 (SDK officiel, chargé une seule fois)
       Méthode de pub : y8Sdk.showAd() = pub plein écran.
       La logique (toutes les 3 manches, arrivée, 10 minutes) est dans ads.js.
  ====================================================== -->

  <script src="ads.js"></script>

  <script
    src="https://cdn.y8.com/minimal-sdk/2-0/y8.min.js"
    async
  ></script>
  <script>
    /* SDK Y8 (identifiants donnés par le portail Y8) */
    let y8Sdk;

    window.addEventListener("y8sdk.ready", function () {
      y8Sdk = y8.sdk();

      const appConfig = {
        appId: '6afc14e800d920186992b67d',
        autoLogin: true
      };

      const adConfig = {
        gameId: '293757',
        preloadAdBreaks: 'on',
        sound: 'on',
        onReady: function () {}
      };

      y8Sdk.init(appConfig, adConfig);
      y8Sdk.onAuth(function (user, error) {});
      if (window.StorybakAds) window.StorybakAds.setSdk(y8Sdk);
    }, { once: true });

    // Si le SDK est déjà chargé
    if (window.y8 && window.y8.emitReadyEvent) {
      window.y8.emitReadyEvent();
    }
  </script>


  <!-- =====================================================
       🎮 JAVASCRIPT DU JEU
  ====================================================== -->

  <script src="script.js"></script>
  <script src="arcade.js"></script>
  <script src="solo.js"></script>
  <script src="tournoi.js"></script>
  <script src="defi.js"></script>
  <script src="entrainement.js"></script>
  <script src="inverse.js"></script>
  <script src="double.js"></script>
  <script src="sansyeux.js"></script>
  <script src="survie.js"></script>


  <!-- =====================================================
       📊 VERCEL INSIGHTS
  ====================================================== -->


</body>

</html>
