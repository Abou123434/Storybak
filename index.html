<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Fun Generator 🔥</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

header {
    padding: 15px;
    background: #ff4757;
    font-size: 20px;
}

.menu button {
    margin: 5px;
    padding: 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.container {
    padding: 20px;
}

button.generate {
    padding: 15px 30px;
    margin-top: 20px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
}

#result {
    margin-top: 30px;
}

.share a, .share div {
    display: block;
    margin: 10px;
    padding: 10px;
    border-radius: 20px;
    text-decoration: none;
    color: white;
}

.whatsapp { background: #25D366; }
.facebook { background: #1877F2; }
.copy { background: black; }
</style>
</head>

<body>

<header>🔥 Fun Generator 🔥</header>

<div class="menu">
    <button onclick="setMode('alter')">Alter Ego</button>
    <button onclick="setMode('crush')">Crush 😏</button>
    <button onclick="setMode('iq')">QI 🧠</button>
</div>

<div class="container">
    <h2 id="title">Choisis un mode</h2>
    <button class="generate" onclick="generate()">Générer</button>
    <div id="result"></div>
</div>

<script>
let mode = "alter";

function setMode(m) {
    mode = m;
    document.getElementById("result").innerHTML = "";
    
    if(m === "alter") document.getElementById("title").innerText = "🔥 Ton Alter Ego";
    if(m === "crush") document.getElementById("title").innerText = "😏 Ton crush pense quoi de toi ?";
    if(m === "iq") document.getElementById("title").innerText = "🧠 Ton niveau d’intelligence";
}

function random(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generate() {
    let text = "";

    if(mode === "alter") {
        const noms = ["Shadow", "Blaze", "Nova", "Storm"];
        const roles = ["Ninja", "Boss", "Mage"];
        text = "🔥 Mon alter ego est " + random(noms) + " " + random(roles);
    }

    if(mode === "crush") {
        const reactions = [
            "Il/elle t'aime en secret 😍",
            "Il/elle hésite encore 🤔",
            "Il/elle pense à toi la nuit 😳"
        ];
        text = "😏 Verdict : " + random(reactions);
    }

    if(mode === "iq") {
        const iq = Math.floor(Math.random() * 80) + 80;
        text = "🧠 Ton QI est " + iq;
    }

    document.getElementById("result").innerHTML = `
        <h3>${text}</h3>

        <div class="share">
            <a class="whatsapp" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank">
            WhatsApp 📲
            </a>

            <a class="facebook" href="https://www.facebook.com/sharer/sharer.php?u=&quote=${encodeURIComponent(text)}" target="_blank">
            Facebook 📘
            </a>

            <div class="copy" onclick="copyText('${text}')">
            Copier (TikTok / Instagram) 📋
            </div>
        </div>
    `;
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    alert("Copié 🔥 Colle sur TikTok ou Instagram");
}
</script>

</body>
</html>
