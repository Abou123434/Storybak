<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Bako</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mini Bako</h1>
    <button id="addImageBtn">Publier une image</button>
</header>

<main>
    <div id="voteContainer">
        <!-- Les deux images à voter apparaîtront ici -->
    </div>
    <p id="voteInfo">Clique sur une image pour voter !</p>
</main>

<!-- Modal pour publier une image -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2>Publier une image</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button id="publishBtn">Publier</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
