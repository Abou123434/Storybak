<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryBak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <h1 class="logo">Story<span class="highlight">Bak</span></h1>
</header>

<input type="file" id="fileInput" accept="image/*,video/*" hidden>

<!-- ===== STORIES ===== -->
<div class="stories" id="stories"></div>

<!-- ===== VIEWER ===== -->
<div class="viewer" id="viewer">

  <div id="progressContainer"></div>
  <div class="content" id="content"></div>

  <div class="bottom-bar">
    <div class="view-count" id="viewCount"></div>

    <div class="reactions">
      <span onclick="react('❤️')">❤️</span>
      <span onclick="react('😂')">😂</span>
      <span onclick="react('🔥')">🔥</span>
      <span onclick="react('😮')">😮</span>
    </div>
  </div>

  <div class="tap-left" onclick="prevStory()"></div>
  <div class="tap-right" onclick="nextStory()"></div>

  <div id="progressControls"></div>

</div>

<!-- ===== 🍔 MENU ===== -->
<div id="hamburgerContainer">
  <div id="hamburger">&#9776;</div>

  <div id="menuOptions">
    <p id="walletBtn">🪙 Mon solde</p>
    <p id="changeProfileBtn">👤 Changer profil</p>
    <p id="adminBtn">⚙️ Admin Panel</p>
    <p id="logoutBtn">🚪 Déconnexion</p>
  </div>
</div>

<!-- ===== 💼 WALLET ===== -->
<div id="walletOverlay">
  <div class="wallet-content">

    <h2>Mon portefeuille</h2>

    <p>🪙 Coins : <span id="walletCoins">0</span></p>
    <p>💎 Diamonds : <span id="walletDiamonds">0</span></p>
    <p>🪙 Valeur : <span id="walletValue">0 €</span></p>

    <!-- ✅ SEULEMENT RETIRER -->
    <div class="wallet-buttons">
      <button id="withdrawBtn" class="withdraw-btn">Retirer</button>
    </div>

    <!-- ✅ FERMER -->
    <button id="closeWallet" class="red-btn">Fermer</button>

  </div>
</div>

<!-- ===== 💸 RETRAIT ===== -->
<div id="withdrawModal">
  <div class="modal-content">

    <h3>Retirer</h3>

    <p>Solde : <span id="withdrawBalance">0</span> €</p>

    <input type="number" id="withdrawAmount" placeholder="Montant">

    <!-- ✅ PAYPAL -->
    <button onclick="sendToPaypal()" class="withdraw-btn">
      Confirmer retrait
    </button>

    <button id="closeWithdraw" class="red-btn">Fermer</button>

  </div>
</div>

<!-- ===== ⚙️ ADMIN PANEL ===== -->
<div id="adminPanel">

  <div class="admin-header">
    <h2>Admin Panel</h2>
    <button onclick="closeAdmin()" class="red-btn">Fermer</button>
  </div>

  <div class="platform-balance">
    Solde de la plateforme
  </div>

  <div class="admin-body"></div>

</div>

<script src="script.js"></script>

</body>
</html>
