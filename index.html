<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Dare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Daily Dare 🌍</h1>
    
    <div class="daily-challenge">
      <span class="calendar">📅</span>
      <span class="title">Défi du jour</span>
      <h2>MONTRER TON FRIGO</h2>
    </div>

    <div class="buttons">
      <button id="participer">📸 Participer</button>
      <button id="voir">👀 Voir les participations</button>
    </div>

    <!-- Aperçu image sélectionnée -->
    <div id="previewContainer" class="preview-container" style="display:none;">
      <h3>Image sélectionnée :</h3>
      <img id="preview" src="" alt="Preview">
    </div>
  </div>

  <!-- Input caché pour ouvrir la galerie -->
  <input type="file" id="fileInput" accept="image/*" style="display:none" />

  <script src="script.js"></script>
</body>
</html>
