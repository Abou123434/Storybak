<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryBak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 class="logo">Story<span class="highlight">Bak</span></h1>
</header>

<!-- Upload story -->
<input type="file" id="fileInput" hidden accept="image/*,video/*">

<!-- Liste stories -->
<div class="stories" id="stories"></div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="progress-container" id="progressContainer"></div>
  <div class="content" id="content"></div>
  <div class="view-count" id="viewCount"></div>
  <div class="tap-left" onclick="prevStory()"></div>
  <div class="tap-right" onclick="nextStory()"></div>
  <div id="progressControls"></div>
</div>

<!-- MODAL CADEAU -->
<div id="giftModal">
  <div class="modal-content">
    <div id="coinBalance">💰 0</div>
    <button id="buyCoins">+ Acheter coins</button>
    <h3>Envoyer un cadeau</h3>
    <div class="gift-options">
      <button data-cost="1">🌹 Rose</button>
      <button data-cost="10">🔥 Feu</button>
      <button data-cost="100">🚀 Fusée</button>
      <button data-cost="30000">🦁 Lion</button>
      <button data-cost="100000">🐉 Dragon</button>
    </div>
    <div id="giftMessage"></div>
    <button id="closeGiftModal">Fermer</button>
  </div>
</div>

<!-- MODAL ACHAT COINS -->
<div id="buyCoinsModal">
  <div class="modal-content">
    <h3>Acheter coins</h3>
    <ul>
      <li onclick="openPayment()">1 pièce – 0.01€</li>
      <li onclick="openPayment()">10 pièces – 0.10€</li>
      <li onclick="openPayment()">100 pièces – 1€</li>
      <li onclick="openPayment()">30000 pièces – 300€</li>
      <li onclick="openPayment()">100000 pièces – 1000€</li>
    </ul>
    <button onclick="closeBuy()">Fermer</button>
  </div>
</div>

<!-- MODAL PAIEMENT -->
<div id="paymentModal">
  <div class="modal-content">
    <h3>Moyen paiement</h3>
    <button onclick="openBlank()">💳 Carte</button>
    <button onclick="openBlank()">🅿️ PayPal</button>
    <button onclick="openMobile()">📱 Mobile Money</button>
    <button onclick="closePayment()">Fermer</button>
  </div>
</div>

<!-- MODAL MOBILE MONEY -->
<div id="mobileMoneyModal">
  <div class="modal-content">
    <h3>Mobile Money</h3>
    <button onclick="openBlank()">MTN</button>
    <button onclick="openBlank()">MOOV</button>
    <button onclick="openBlank()">ORANGE</button>
    <button onclick="openBlank()">WAVE</button>
    <button onclick="closeMobile()">Fermer</button>
  </div>
</div>

<!-- HAMBURGER -->
<div id="hamburgerContainer">
  <div id="hamburger">&#9776;</div>
  <div id="menuOptions">
    <p>Solde</p>
    <p>Changer profil</p>
    <p>Déconnexion</p>
  </div>
</div>

<script src="script.js"></script>
</body>
  </html>
