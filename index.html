<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryBak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo">Story<span class="highlight">Bak</span></h1>
  </header>

  <!-- Input pour ajouter stories (hidden) -->
  <input type="file" id="fileInput" accept="image/*,video/*" hidden>

  <!-- Liste des stories -->
  <div class="stories" id="stories"></div>

  <!-- VIEWER -->
  <div class="viewer" id="viewer">
    <div class="progress-container" id="progressContainer"></div>
    <div class="content" id="content"></div>
    <div class="view-count" id="viewCount"></div>
    <div class="tap-left" onclick="prevStory()"></div>
    <div class="tap-right" onclick="nextStory()"></div>
    <div class="reactions">
      <span onclick="react('❤️')">❤️</span>
      <span onclick="react('😂')">😂</span>
      <span onclick="react('🔥')">🔥</span>
      <span onclick="react('😮')">😮</span>
    </div>
  </div>

  <!-- MODAL CADEAU -->
  <div id="giftModal">
    <div class="modal-content">
      <div id="coinBalance">💰 0</div>
      <button id="buyCoins">+ Acheter des coins</button>
      <h3>Envoyer un cadeau</h3>
      <div class="gift-options">
        <button data-cost="1">🌹 Rose – 1 pièce</button>
        <button data-cost="10">🔥 Feu – 10 pièces</button>
        <button data-cost="100">🚀 Fusée – 100 pièces</button>
        <button data-cost="30000">🦁 Lion – 30 000 pièces</button>
        <button data-cost="100000">🐉 Dragon – 100 000 pièces</button>
      </div>
      <div id="giftMessage"></div>
      <button id="closeGiftModal">Fermer</button>
    </div>
  </div>

  <!-- MENU HAMBURGER -->
  <div id="hamburgerMenu">
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="menuOptions" id="menuOptions">
      <p>Solde</p>
      <p>Changer de profil</p>
      <p>Déconnexion</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
