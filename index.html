<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taverna dei Rutuli</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>La Taverna dei Rutuli</h1>
<div class="lang">
<button onclick="setLang('it')">IT</button>
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('de')">DE</button>
</div>
</header>

<section class="hero">
<h2 id="heroTitle"></h2>
<p id="heroText"></p>
<a id="reserveBtn" target="_blank" class="btn"></a>
</section>

<section class="menu">
<h2 id="menuTitle"></h2>
<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1558030006-450675393462">
<h3>Bistecca alla brace</h3>
<p id="dish1"></p>
<a class="btn" href="https://wa.me/393913404676" target="_blank">WhatsApp</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
<h3>Pasta fresca</h3>
<p id="dish2"></p>
<a class="btn" href="https://wa.me/393913404676" target="_blank">WhatsApp</a>
</div>

</div>
</section>

<section class="story">
<h2 id="storyTitle"></h2>
<p id="storyText"></p>
</section>

<section class="map">
<iframe src="https://maps.google.com/maps?q=Ardea&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<section class="contact">
<h2 id="contactTitle"></h2>
<p id="address"></p>
<p id="phone"></p>
</section>

<footer>
<p>© 2026 Taverna dei Rutuli</p>
</footer>

<script src="script.js"></script>
</body>
</html>
