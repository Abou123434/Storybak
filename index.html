<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ton Alter Ego 🔥</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #ff4757, #1e90ff);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100vh;
}

.container {
    padding: 20px;
}

h1 {
    font-size: 28px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: white;
    color: black;
    cursor: pointer;
    margin-top: 20px;
}

#result {
    margin-top: 30px;
    animation: fadeIn 0.5s ease;
}

img {
    margin-top: 15px;
    border-radius: 50%;
    border: 3px solid white;
}

.share-btn {
    display: block;
    margin-top: 15px;
    padding: 10px;
    background: #25D366;
    color: white;
    border-radius: 20px;
    text-decoration: none;
}

.copy-btn {
    margin-top: 10px;
    background: #000;
    color: white;
    padding: 10px;
    border-radius: 20px;
    cursor: pointer;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.9);}
    to {opacity: 1; transform: scale(1);}
}
</style>

</head>
<body>

<div class="container">
    <h1>🔥 Découvre ton alter ego 🔥</h1>
    <p>Clique et vois qui tu es vraiment 😎</p>

    <button onclick="generate()">Générer</button>

    <div id="result"></div>
</div>

<script>
const noms = ["Shadow", "Blaze", "Nova", "Phantom", "Storm", "Vortex"];
const roles = ["Guerrier", "Hacker", "Roi", "Ninja", "Mage", "Boss"];
const pouvoirs = ["du feu 🔥", "de la glace ❄️", "de l'électricité ⚡", "du temps ⏳", "de l'ombre 🌑"];

function random(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generate() {
    let nom = random(noms);
    let role = random(roles);
    let pouvoir = random(pouvoirs);

    let pseudo = nom + " " + role;

    let text = "🔥 Mon alter ego est " + pseudo + " avec le pouvoir " + pouvoir;

    document.getElementById("result").innerHTML = `
        <h2>${pseudo}</h2>
        <p>Pouvoir : ${pouvoir}</p>
        <img src="https://robohash.org/${pseudo}" width="120">
        
        <a class="share-btn" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank">
        📲 Partager sur WhatsApp
        </a>

        <div class="copy-btn" onclick="copyText('${text}')">
        📋 Copier mon résultat
        </div>
    `;
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    alert("Copié 🔥");
}
</script>

</body>
</html>
