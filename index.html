<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- =========================
       SEO
  ========================== -->

  <title>Storybak – Jeu de mémoire et de réflexion en ligne</title>

  <meta
    name="description"
    content="Storybak est un jeu de mémoire et de réflexion en ligne gratuit. Teste ta mémoire, ta concentration et tes réflexes avec des séquences de couleurs."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <meta
    name="author"
    content="Storybak"
  >

  <meta
    name="application-name"
    content="Storybak"
  >

  <link
    rel="canonical"
    href="https://storybak.vercel.app/"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <!-- =========================
       OPEN GRAPH
  ========================== -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Storybak – Jeu de mémoire et de réflexion"
  >

  <meta
    property="og:description"
    content="Teste ta mémoire, ta concentration et tes réflexes avec Storybak, un jeu gratuit de réflexion et de mémoire en ligne."
  >

  <meta
    property="og:url"
    content="https://storybak.vercel.app/"
  >

  <meta
    property="og:site_name"
    content="Storybak"
  >

  <meta
    property="og:locale"
    content="fr_FR"
  >

  <!-- =========================
       TWITTER / X
  ========================== -->

  <meta
    name="twitter:card"
    content="summary"
  >

  <meta
    name="twitter:title"
    content="Storybak – Jeu de mémoire et de réflexion"
  >

  <meta
    name="twitter:description"
    content="Jeu gratuit de mémoire, de réflexion et de concentration en ligne."
  >

  

  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <!-- =====================================================
       🎮 CONTENEUR PRINCIPAL
  ====================================================== -->

  <div
    class="container"
    id="game"
  >


    <!-- =====================================================
         👤 PHOTO DE PROFIL
    ====================================================== -->

    <div id="profileContainer">

      <img
        id="profilePic"
        src="file_0000000097a881f48f3a71f96f908dc0.png"
        alt="Profil"
      >

    </div>


    <!-- =====================================================
         🖼️ PROFIL EN GRAND
    ====================================================== -->

    <div id="profileModal">

      <img
        src="file_0000000097a881f48f3a71f96f908dc0.png"
        alt="Profil"
      >

    </div>


    <!-- =====================================================
         📥 TÉLÉCHARGER APK
    ====================================================== -->

    <a
      href="https://storybak.vercel.app/app-release.apk"
      target="_blank"
    >
      <button type="button">
        📥 Télécharger l’APK
      </button>
    </a>


    <!-- =====================================================
         📤 PARTAGER
    ====================================================== -->

    <button
      id="shareBtn"
      type="button"
    >
      📤 Partager
    </button>


    <!-- =====================================================
         📱 MENU PARTAGE
    ====================================================== -->

    <div
      id="shareMenu"
      class="hidden"
    >

      <a
        id="whatsappShare"
        target="_blank"
      >
        📱 WhatsApp
      </a>

      <a
        id="facebookShare"
        target="_blank"
      >
        📘 Facebook
      </a>

    </div>


    <!-- =====================================================
         🧠 TITRE
    ====================================================== -->

    <h1 id="title">
      🧠 Memory Flash Pro
    </h1>


    <!-- =====================================================
         🌍 LANGUE
    ====================================================== -->

    <label id="langLabel">
      🌍 Langue :
    </label>

    <select id="langSelect">

      <option value="fr">
        Français
      </option>

      <option value="en">
        English
      </option>

      <option value="es">
        Español
      </option>

      <option value="de">
        Deutsch
      </option>

      <option value="ar">
        العربية
      </option>

    </select>


    <!-- =====================================================
         📊 INFORMATIONS DU JEU
    ====================================================== -->

    <p>

      <span id="levelLabel">
        Niveau
      </span>

      :

      <span id="level">
        1
      </span>

    </p>


    <p>

      <span id="scoreLabel">
        Score
      </span>

      :

      <span id="score">
        0
      </span>

    </p>


    <p>

      <span id="livesLabel">
        Vies
      </span>

      :

      <span id="lives">
        5
      </span>

    </p>


    <!-- =====================================================
         🔄 BOUTON « REJOUER » (solo : plus de vies, gratuit)
    ====================================================== -->

    <button
      id="refillBtn"
      type="button"
      style="display:none;"
    >
      🔄 Rejouer
    </button>


    <!-- =====================================================
         💬 MESSAGE
    ====================================================== -->

    <p id="msg">
      Appuie sur START
    </p>


    <!-- =====================================================
         ⏱️ TIMER
    ====================================================== -->

    <p id="timer"></p>


    <!-- =====================================================
         🎨 4 CARRÉS DE SÉQUENCE
    ====================================================== -->

    <div
      id="flashGrid"
      class="grid"
    >

      <div
        class="btn red"
        onclick="pick('red')"
      ></div>

      <div
        class="btn green"
        onclick="pick('green')"
      ></div>

      <div
        class="btn blue"
        onclick="pick('blue')"
      ></div>

      <div
        class="btn yellow"
        onclick="pick('yellow')"
      ></div>

    </div>


    <!-- =====================================================
         🎮 BOUTONS JOUEUR
    ====================================================== -->

    <div
      id="answerBox"
      class="hidden"
    >

      <button
        type="button"
        class="answer-btn red"
        onclick="pick('red')"
      >
        <span
          class="color-name"
          data-color="red"
        >
          Rouge
        </span>
      </button>


      <button
        type="button"
        class="answer-btn green"
        onclick="pick('green')"
      >
        <span
          class="color-name"
          data-color="green"
        >
          Vert
        </span>
      </button>


      <button
        type="button"
        class="answer-btn blue"
        onclick="pick('blue')"
      >
        <span
          class="color-name"
          data-color="blue"
        >
          Bleu
        </span>
      </button>


      <button
        type="button"
        class="answer-btn yellow"
        onclick="pick('yellow')"
      >
        <span
          class="color-name"
          data-color="yellow"
        >
          Jaune
        </span>
      </button>

    </div>


    <!-- =====================================================
         ⭐ START
    ====================================================== -->

    <button
      id="star"
      type="button"
    >

      <span id="startText">
        ⭐ Commencer
      </span>

    </button>


  </div>


  <!-- =====================================================
       🔊 SONS
  ====================================================== -->

  <audio
    id="clickSound"
    src="click.mp3"
  ></audio>

  <audio
    id="winSound"
    src="win.mp3"
  ></audio>

  <audio
    id="failSound"
    src="fail.mp3"
  ></audio>


  <!-- =====================================================
       📢 PUBLICITÉS GAMEMONETIZE (SDK officiel, chargé une seule fois)
       Seule méthode de pub du SDK : sdk.showBanner() = pub vidéo plein écran.
       La logique (toutes les 3 manches, arrivée, 10 minutes) est dans ads.js.
  ====================================================== -->

  <script src="ads.js"></script>

  <script type="text/javascript">
    window.SDK_OPTIONS = {
      gameId: "vsksh3dtagq8hhuuzck2q44o1wvy0jm6",

      onEvent: function (a) {
        /* SDK_GAME_PAUSE : pub prête → son coupé, jeu en pause
           SDK_GAME_START : pub terminée → on reprend, son remis
           SDK_READY      : le SDK est prêt */
        if (window.StorybakAds) window.StorybakAds.onSdkEvent(a);
      }
    };

    (function (a, b, c) {
      var d = a.getElementsByTagName(b)[0];

      if (!a.getElementById(c)) {
        var s = a.createElement(b);
        s.id = c;
        s.src = "https://api.gamemonetize.com/sdk.js";
        d.parentNode.insertBefore(s, d);
      }
    })(document, "script", "gamemonetize-sdk");
  </script>


  <!-- =====================================================
       🎮 JAVASCRIPT DU JEU
  ====================================================== -->

  <script src="script.js"></script>
  <script src="arcade.js"></script>
  <script src="solo.js"></script>
  <script src="tournoi.js"></script>
  <script src="defi.js"></script>
  <script src="entrainement.js"></script>
  <script src="inverse.js"></script>
  <script src="double.js"></script>
  <script src="sansyeux.js"></script>
  <script src="survie.js"></script>


  <!-- =====================================================
       📊 VERCEL INSIGHTS
  ====================================================== -->

  <script
    defer
    src="/_vercel/insights/script.js"
  ></script>


</body>

</html>
