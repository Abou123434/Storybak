<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Facemash</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body { font-family: Arial; text-align:center; margin:20px; }
.vote-container { display:flex; justify-content:center; gap:40px; margin-top:40px; }
.vote-card { cursor:pointer; transition: transform 0.2s; }
.vote-card:hover { transform: scale(1.05); }
.vote-card img { width:250px; border-radius:10px; }
</style>
</head>
<body>
<h1>Mini Facemash Django</h1>
<p>Clique sur une image pour voter !</p>

<div class="vote-container">
    {% for img in pair %}
    <div class="vote-card" data-id="{{ img.id }}">
        <img src="{{ img.image_file.url }}" alt="Image">
    </div>
    {% endfor %}
</div>

<script>
$('.vote-card').click(function(){
    let imageId = $(this).data('id');
    $.get('/vote/' + imageId + '/', function(){
        location.reload();
    });
});
</script>
</body>
</html>
